# grindset — standalone HTTPS for grindset.kloai.ru
# Certificates are mounted from ./ssl (crt.txt = certificate chain, key.txt = private key).

server {
    listen 80;
    server_name grindset.kloai.ru;

    # used by the container healthcheck
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name grindset.kloai.ru;

    ssl_certificate /etc/nginx/ssl/crt.txt;
    ssl_certificate_key /etc/nginx/ssl/key.txt;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;
    gzip_min_length 1000;

    # Hashed build assets never change
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA: every route serves index.html, which must not be cached
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
