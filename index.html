<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>grindset</title>
    <script>
      // Telegram Mini App SDK — only when launched from Telegram (launch params in the hash,
      // or saved by the SDK for reloads). The regular web version doesn't depend on telegram.org.
      (function () {
        var inTelegram = /tgWebAppData=/.test(location.hash);
        try {
          inTelegram = inTelegram || !!sessionStorage.getItem('__telegram__initParams');
        } catch (e) {}
        if (inTelegram) document.write('<script src="https://telegram.org/js/telegram-web-app.js?59"><\/script>');
      })();
    </script>
    <script>
      (function () {
        var t = 'system';
        try {
          t = localStorage.getItem('theme') || 'system';
        } catch (e) {}
        var app = window.Telegram && window.Telegram.WebApp;
        var systemDark = app && app.initData ? app.colorScheme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.classList.toggle('dark', t === 'dark' || (t === 'system' && systemDark));
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
